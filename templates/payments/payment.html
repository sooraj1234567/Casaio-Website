<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Casaio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .payment-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .payment-header {
            margin-bottom: 30px;
        }

        .payment-icon {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .payment-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .payment-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .order-details {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
            border-top: 1px solid #e0e0e0;
            padding-top: 12px;
            margin-top: 12px;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #1a1a1a;
            font-weight: 600;
        }

        .amount-total {
            font-size: 20px;
            color: #ff6a00;
        }

        .processing-info {
            background: #e8f4f8;
            border-left: 4px solid #00bcd4;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: left;
        }

        .processing-info i {
            color: #00bcd4;
            margin-right: 10px;
        }

        .processing-text {
            font-size: 13px;
            color: #00695c;
            margin: 0;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: #4caf50;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .security-badge i {
            font-size: 16px;
        }

        @media (max-width: 480px) {
            .payment-container {
                padding: 24px;
            }

            .payment-title {
                font-size: 24px;
            }

            .payment-icon {
                font-size: 48px;
            }
        }

        .hidden {
            display: none;
        }

        .error-message {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 16px;
            border-radius: 8px;
            color: #c62828;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="payment-container">

    <div class="payment-header">
        <div class="payment-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1 class="payment-title">Secure Payment</h1>
        <p class="payment-subtitle">Complete your payment securely</p>
    </div>

    <div class="order-details">
        <div class="detail-row">
            <span class="detail-label">Order ID:</span>
            <span class="detail-value">#{{ order.id }}</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Amount:</span>
            <span class="detail-value amount-total">₹{{ order.total|floatformat:2 }}</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Payment Method:</span>
            <span class="detail-value">Razorpay</span>
        </div>
    </div>

    <div class="processing-info">
        <i class="fas fa-info-circle"></i>
        <p class="processing-text">
            You will be redirected to our secure payment gateway. Your transaction is 100% safe and encrypted.
        </p>
    </div>

    <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText"></span>
    </div>

    <div class="security-badge">
        <i class="fas fa-shield-alt"></i>
        <span>256-bit SSL Encrypted</span>
    </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

var options = {

    key: "{{ razorpay_key }}",

    amount: "{{ razorpay_order.amount }}",

    currency: "INR",

    name: "Casaio",

    description: "Order Payment for Order #{{ order.id }}",

    order_id: "{{ razorpay_order.id }}",

    handler: function (response) {

        console.log("Payment Successful!");
        console.log(response);

        // Show loading state
        var container = document.querySelector('.payment-container');
        container.innerHTML = '<div class="payment-icon"><i class="fas fa-spinner fa-spin"></i></div><h2>Processing Payment...</h2><p>Please wait, we are verifying your payment.</p>';

        fetch("{% url 'payments:verify_payment' %}", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },

            body: JSON.stringify({

                razorpay_payment_id: response.razorpay_payment_id,

                razorpay_order_id: response.razorpay_order_id,

                razorpay_signature: response.razorpay_signature,

                order_id: "{{ order.id }}"

            })

        })
        .then(response => response.json())
        .then(data => {

            console.log(data);

            if (data.success) {

                window.location.href = data.redirect_url;

            } else {

                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorText').textContent = 'Payment verification failed. Please try again.';
                container.innerHTML = '<div style="text-align:center;"><h2>Verification Failed</h2><p>There was an issue verifying your payment. Please contact support.</p><a href="/checkout/" style="color: #667eea; text-decoration: underline;">Back to Checkout</a></div>';

            }

        })
        .catch(error => {

            console.error(error);

            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = 'Unable to process payment. ' + error.message;

        });

    },

    modal: {

        ondismiss: function () {

            console.log("Payment popup closed");

            // User closed the payment modal
            var container = document.querySelector('.payment-container');
            container.innerHTML = '<div style="text-align:center;"><h2>Payment Cancelled</h2><p>You closed the payment window. Your order was not confirmed.</p><a href="/checkout/" style="padding: 10px 20px; background: #667eea; color: white; text-decoration: none; border-radius: 8px; display: inline-block;">Back to Checkout</a></div>';

        }

    },

    theme: {

        color: "#ff6a00"

    }

};

var rzp = new Razorpay(options);

rzp.on("payment.failed", function (response) {

    console.log("Payment Failed");

    console.log(response.error);

    document.getElementById('errorMessage').style.display = 'block';
    document.getElementById('errorText').textContent = 'Payment failed: ' + response.error.description;

    var container = document.querySelector('.payment-container');
    container.innerHTML = '<div style="text-align:center;"><h2>Payment Failed</h2><p>Your payment could not be processed.</p><p>' + response.error.description + '</p><a href="/checkout/" style="padding: 10px 20px; background: #ff6a00; color: white; text-decoration: none; border-radius: 8px; display: inline-block;">Try Again</a></div>';

});

// Automatically open payment modal
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        rzp.open();
    }, 500);
});

</script>

</body>
</html>
