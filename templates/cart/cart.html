{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container py-5">

    <h2 class="fw-bold mb-4">
        Shopping Cart
    </h2>

    <div class="row">

        <!-- Cart Items -->
        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body">

                    <div id="cartPageItems">

                        <!-- Loaded by JavaScript -->

                    </div>

                </div>

            </div>

        </div>

        <!-- Order Summary -->
        <div class="col-lg-4">

            <div class="card shadow-sm sticky-top">

                <div class="card-body">

                    <h4 class="mb-4">
                        Order Summary
                    </h4>

                    <div class="d-flex justify-content-between">

                        <span>Subtotal</span>

                        <span id="summarySubtotal">₹0</span>

                    </div>

                    <div class="d-flex justify-content-between mt-2">

                        <span>Shipping</span>

                        <span class="text-success">
                            FREE
                        </span>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-between fw-bold fs-5">

                        <span>Total</span>

                        <span id="summaryTotal">
                            ₹0
                        </span>

                    </div>

                        <a href="{% url 'checkout:checkout' %}"
                           class="btn btn-dark w-100">

                            Proceed to Checkout

                        </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{% static 'js/cart/cart_page.js' %}"></script>

{% endblock %}
