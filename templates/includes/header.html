{% load static %}

<header class="main-header">

    <div class="container">

        <div class="header-wrapper">

            <!-- Logo -->
            <div class="logo">
                <a href="/">
                    <img src="{% static 'images/logo.png' %}" alt="Casaio">
                </a>
            </div>

            <!-- Search -->
            <div class="header-search">

                <form action="#" method="GET">

                    <input
                        type="text"
                        name="q"
                        placeholder="Search for products...">

                    <select name="category">
                        <option value="">All Categories</option>
                        <option>Kitchen</option>
                        <option>Furniture</option>
                        <option>Home Decor</option>
                        <option>Lighting</option>
                        <option>Storage</option>
                    </select>

                    <button type="submit">
                        <i class="bi bi-search"></i>
                    </button>

                </form>

            </div>

            <!-- Header Icons -->
            <div class="header-icons">

                {% if user.is_authenticated %}

                <!-- User Profile -->
                <div class="user-profile-dropdown">

                    <button class="user-profile-toggle" id="userProfileToggle">
                        <i class="bi bi-person-circle"></i>
                    </button>

                    <div class="user-dropdown-menu" id="userDropdownMenu">

                        <!-- User Header -->
                        <div class="dropdown-user-header">

                            <div class="user-avatar">
                                <i class="bi bi-person-circle"></i>
                            </div>

                            <div class="user-info">
                                <p class="user-name">
                                    {{ user.first_name|default:user.username }}
                                </p>
                                <p class="user-email">
                                    {{ user.email }}
                                </p>
                            </div>

                        </div>

                        <hr class="dropdown-divider">

                        <a href="#" class="dropdown-item">
                            <i class="bi bi-person"></i>
                            <span>My Profile</span>
                        </a>

                        <a href="{% url 'orders:my_orders' %}" class="dropdown-item">
                            <i class="bi bi-bag-check"></i>
                            <span>My Orders</span>
                        </a>

                        <a href="{% url 'wishlist:wishlist' %}" class="dropdown-item">
                            <i class="bi bi-bookmark-heart"></i>
                            <span>Wishlist</span>
                        </a>

                        <a href="#" class="dropdown-item">
                            <i class="bi bi-map"></i>
                            <span>Saved Addresses</span>
                        </a>

                        <a href="#" class="dropdown-item">
                            <i class="bi bi-gear"></i>
                            <span>Settings</span>
                        </a>

                        <hr class="dropdown-divider">

                        <a href="{% url 'logout' %}" class="dropdown-item logout">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Logout</span>
                        </a>

                    </div>

                </div>

                {% else %}

                <a href="{% url 'login' %}" class="icon-box">
                    <i class="bi bi-person"></i>
                    <span>Sign In</span>
                </a>

                {% endif %}

                <a href="{% url 'wishlist:wishlist' %}" class="icon-box position-relative">

                    <i class="bi bi-heart"></i>

                    <span id="wishlistBadge"
                          class="badge bg-danger position-absolute top-0 start-100 translate-middle"
                          {% if wishlist_count == 0 %}style="display:none;"{% endif %}>

                        {{ wishlist_count }}

                    </span>

                </a>

                <!-- Cart -->
                <a href="#"
                   id="cartToggle"
                   class="icon-box position-relative">

                    <i class="bi bi-cart3"></i>

                    <span
                        id="cartBadge"
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        {% if cart_count == 0 %}style="display:none;"{% endif %}>

                        {{ cart_count }}

                    </span>

                </a>

            </div>

        </div>

    </div>

</header>
