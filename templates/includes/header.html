{% load static %}

<header class="main-header">
    <div class="container">
        <div class="header-wrapper">

            <!-- Logo -->
            <div class="logo">
                <a href="/">
                    <img src="{% static 'images/logo.png' %}" alt="Casaio">
                </a>
            </div>

            <!-- Search Bar -->
            <div class="header-search">
                <form action="#" method="GET" class="search-form">
                    <input type="text" name="q" placeholder="Search products..." autocomplete="off">

                    <select name="category" class="category-select">
                        <option value="">All Categories</option>
                        <option>Kitchen</option>
                        <option>Furniture</option>
                        <option>Home Decor</option>
                        <option>Lighting</option>
                        <option>Storage</option>
                    </select>

                    <button type="submit" aria-label="Search">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>

            <!-- Header Action Icons -->
            <div class="header-icons">

                {% if user.is_authenticated %}
                <!-- User Profile Dropdown -->
                <div class="user-profile-dropdown">
                    <button class="user-profile-toggle" id="userProfileToggle" type="button" aria-label="User Menu" aria-expanded="false" aria-controls="userDropdownMenu">
                        <i class="bi bi-person"></i>
                    </button>

                    <div class="user-dropdown-menu" id="userDropdownMenu">
                        <div class="dropdown-user-header">
                            <div class="user-avatar">
                                <i class="bi bi-person-fill"></i>
                            </div>
                            <div class="user-info">
                                <p class="user-name">
                                    {{ user.first_name|default:user.username }}
                                </p>
                                <p class="user-email">
                                    {{ user.email }}
                                </p>
                            </div>
                        </div>

                        <hr class="dropdown-divider">

                        <a href="{% url 'profile' %}" class="dropdown-item">
                            <i class="bi bi-person"></i>
                            <span>My Profile</span>
                        </a>

                        <a href="{% url 'orders:my_orders' %}" class="dropdown-item">
                            <i class="bi bi-bag-check"></i>
                            <span>My Orders</span>
                        </a>

                        <a href="{% url 'wishlist:wishlist' %}" class="dropdown-item">
                            <i class="bi bi-bookmark-heart"></i>
                            <span>Wishlist</span>
                        </a>

                        <a href="{% url 'checkout:saved_addresses' %}" class="dropdown-item">
                            <i class="bi bi-map"></i>
                            <span>Saved Addresses</span>
                        </a>

                        <a href="{% url 'account_settings' %}" class="dropdown-item">
                            <i class="bi bi-gear"></i>
                            <span>Settings</span>
                        </a>

                        <hr class="dropdown-divider">

                        <a href="{% url 'logout' %}" class="dropdown-item logout">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Logout</span>
                        </a>
                    </div>
                </div>

                {% else %}
                <a href="{% url 'login' %}" class="icon-box">
                    <i class="bi bi-person"></i>
                    <span>Sign In</span>
                </a>
                {% endif %}

                <!-- Wishlist -->
                <a href="{% url 'wishlist:wishlist' %}" class="icon-box header-badge-wrap" aria-label="Wishlist">
                    <i class="bi bi-heart"></i>
                    <span id="wishlistBadge" class="header-badge"{% if wishlist_count == 0 %} style="display:none;"{% endif %}>
                        {{ wishlist_count }}
                    </span>
                </a>

                <!-- Cart Toggle -->
                <a href="#" id="cartToggle" class="icon-box header-badge-wrap" aria-label="Cart">
                    <i class="bi bi-cart3"></i>
                    <span id="cartBadge" class="header-badge"{% if cart_count == 0 %} style="display:none;"{% endif %}>
                        {{ cart_count }}
                    </span>
                </a>

            </div>

        </div>
    </div>
</header>
