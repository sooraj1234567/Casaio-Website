<!-- =========================
     CART DRAWER
========================= -->

<div id="cartDrawer" class="cart-drawer">

    <div class="cart-header">
        <h5>🛒 Added to Cart</h5>

        <button id="closeCartDrawer" class="cart-close">
            &times;
        </button>
    </div>

    <div id="cartItemsContainer">

    <div class="text-center py-5 text-muted">

        <i class="bi bi-cart3 fs-1"></i>

        <p class="mt-3 mb-0">
            Your cart is empty
        </p>

    </div>

</div>

    <hr>

    <div class="cart-subtotal">

        <span>Subtotal</span>

        <strong id="drawerSubtotal">
            ₹0
        </strong>

    </div>

    <div class="cart-actions">

        <button
            id="continueShopping"
            class="btn btn-light w-100 mb-2">

            Continue Shopping

        </button>

		<a href="{% url 'cart_page' %}" class="btn btn-outline-dark w-100">
			View Cart
		</a>

    </div>

</div>

<div id="cartOverlay"></div>
