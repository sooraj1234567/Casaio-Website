{% extends "base.html" %}
{% load static %}

{% block title %}Add New Coupon{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/seller.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5 seller-page">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h3 class="fw-bold mb-4">Create Promotional Coupon</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Coupon Code</label>
                        <input type="text" name="code" class="form-control" placeholder="e.g. SAVE20" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Discount Type</label>
                            <select name="discount_type" class="form-select" required>
                                <option value="percentage">Percentage (%)</option>
                                <option value="fixed">Fixed Amount (₹)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Discount Value</label>
                            <input type="number" step="0.01" name="discount_value" class="form-control" placeholder="e.g. 20 or 500" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Minimum Order Amount (₹)</label>
                            <input type="number" step="0.01" name="minimum_order_amount" value="0" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Usage Limit (Optional)</label>
                            <input type="number" name="usage_limit" class="form-control" placeholder="e.g. 100">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Valid From</label>
                            <input type="datetime-local" name="valid_from" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Valid Until</label>
                            <input type="datetime-local" name="valid_until" class="form-control" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'orders:seller_coupons' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-dark">Create Coupon</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
