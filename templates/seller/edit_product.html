{% extends 'dashboard/AdBase.html' %}
{% load static %}

{% block title %}Edit Product{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Edit Product</h2>
            <p class="text-muted">Update your store product listing details.</p>
        </div>
        <div>
            <a href="{% url 'seller_products' %}" class="btn btn-secondary">Back to Products</a>
        </div>
    </div>
    <hr class="mb-4">

    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Product Name</label>
                <input type="text" name="name" value="{{ product.name }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Price (₹)</label>
                    <input type="number" step="0.01" name="selling_price" value="{{ product.selling_price }}" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Stock Quantity</label>
                    <input type="number" name="stock" value="{{ product.stock }}" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Category</label>
                <select name="category" class="form-select">
                    <option value="">Select Category</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if product.category and product.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Product Image</label>
                {% if product.image %}
                    <div class="mb-2">
                        <img src="{{ product.image.url }}" alt="{{ product.name }}" width="60" class="rounded-3">
                    </div>
                {% endif %}
                <input type="file" name="image" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary px-4">Update Product</button>
        </form>
    </div>
</div>
{% endblock %}
